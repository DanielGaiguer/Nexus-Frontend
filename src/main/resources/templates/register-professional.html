<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cadastro Profissional')}"></head>
<body class="auth-page">

    <div th:replace="~{fragments/header :: header}"></div>

    <main style="min-height:calc(100vh - 72px);display:flex;align-items:center;padding:2rem 0;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card border-0 p-4" style="background:linear-gradient(145deg, rgba(9,14,31,0.95), rgba(13,19,41,0.95));">
                        <div class="card-body p-3">
                            <div class="text-center mb-4">
                                <div class="auth-logo mx-auto mb-3">
                                    <i class="ti ti-user-star"></i>
                                </div>
                                <span class="badge badge-glow d-inline-flex align-items-center gap-1 mb-2">
                                    <i class="ti ti-user"></i>Sou Profissional
                                </span>
                                <h3 class="fw-bold mb-1 text-light">Crie seu perfil</h3>
                                <p style="color:var(--text-secondary);" class="small mb-0">
                                    Preencha seus dados para come&ccedil;ar a receber oportunidades.
                                </p>
                            </div>

                            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                                <i class="ti ti-alert-circle"></i>
                                <span th:text="${error}">Erro</span>
                            </div>

                            <form th:action="@{/auth/register/professional}" method="post">
                                <h6 class="fw-semibold mb-3" style="color:var(--text-accent);font-size:0.85rem;text-transform:uppercase;letter-spacing:0.04em;">
                                    <i class="ti ti-user me-2"></i>Dados pessoais
                                </h6>
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label">Nome completo</label>
                                        <input type="text" class="form-control" name="name" required placeholder="Seu nome">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Telefone</label>
                                        <input type="text" class="form-control" name="phone" placeholder="(11) 99999-9999">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" name="email" required placeholder="seu@email.com">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Senha</label>
                                        <input type="password" class="form-control" name="password" required placeholder="M&iacute;nimo 6 caracteres">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">CEP</label>
                                        <input type="text" class="form-control" name="cep" placeholder="00000-000" maxlength="9">
                                    </div>
                                </div>

                                <hr class="my-4" style="border-color:var(--border-color) !important;">

                                <h6 class="fw-semibold mb-3" style="color:var(--text-accent);font-size:0.85rem;text-transform:uppercase;letter-spacing:0.04em;">
                                    <i class="ti ti-currency-dollar me-2"></i>Expectativas
                                </h6>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Pretens&atilde;o m&iacute;nima (R$)</label>
                                        <div class="input-group">
                                            <span class="input-group-text">R$</span>
                                            <input type="number" step="0.01" class="form-control" name="minimumSalary" placeholder="5.000">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Pretens&atilde;o m&aacute;xima (R$)</label>
                                        <div class="input-group">
                                            <span class="input-group-text">R$</span>
                                            <input type="number" step="0.01" class="form-control" name="maximumSalary" placeholder="12.000">
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-glow w-100 py-2 mt-3">
                                    <i class="ti ti-user-plus me-2"></i>Criar conta
                                </button>
                            </form>

                            <div class="mt-4 text-center">
                                <p class="small mb-0" style="color:var(--text-secondary);">
                                    J&aacute; tem conta? <a th:href="@{/auth/login}" style="color:var(--primary-light);">Fa&ccedil;a login</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.querySelector('form[th\\:action="@{/auth/register/professional}"]');
            if (!form) form = document.querySelector('form[action="/auth/register/professional"]');
            if (!form) return;
            attachSubmitGuard(form, function() {
                var min = parseFloat(form.querySelector('[name="minimumSalary"]').value) || 0;
                var max = parseFloat(form.querySelector('[name="maximumSalary"]').value) || 0;
                return min > 0 && max > 0 && min <= max;
            });
        });
    </script>

</body>
</html>
