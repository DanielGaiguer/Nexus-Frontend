<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/app-shell :: head(${editMode ? 'Editar Projeto' : 'Novo Projeto'})}"></head>
<body class="nexus-app">

<div th:replace="~{fragments/app-shell :: shell}"></div>

<div class="page-wrapper">
  <div th:replace="~{fragments/app-shell :: topbar}"></div>

  <div class="page-body">
    <div class="container-xl py-4" style="max-width:760px">

      <!-- Flash -->
      <div th:if="${errorMsg}" class="nexus-alert nexus-alert-danger mb-4">
        <i class="ti ti-alert-circle"></i><span th:text="${errorMsg}"></span>
      </div>

      <!-- Header -->
      <div class="mb-4">
        <a th:href="@{/company/projects}"
           class="text-decoration-none d-inline-flex align-items-center gap-1 mb-3"
           style="color:#64748b;font-size:0.875rem">
          <i class="ti ti-arrow-left"></i> Voltar para projetos
        </a>
        <h1 class="fw-bold mb-1" style="font-size:1.75rem;letter-spacing:-0.02em;color:#fff"
            th:text="${editMode ? 'Editar Projeto' : 'Novo Projeto'}">Projeto</h1>
        <p style="color:#64748b;font-size:0.875rem"
           th:text="${editMode ? 'Atualize as informações do projeto. Scores de matches em aberto serão recalculados.' : 'Preencha as informações do projeto. O ranking de profissionais será gerado automaticamente.'}">—</p>
      </div>

      <!-- Info alert -->
      <div class="nexus-alert nexus-alert-info mb-4" style="font-size:0.82rem">
        <i class="ti ti-robot"></i>
        <span th:text="${editMode} ? 'Ao salvar, o sistema recalculará os scores dos matches ainda aguardando resposta (status Waiting).' : 'Ao criar, o sistema gera automaticamente um ranking de compatibilidade com todos os profissionais elegíveis.'">—</span>
      </div>

      <!-- Form -->
      <div class="nexus-card p-4">
        <form th:action="${editMode ? '/company/projects/' + project.id + '/edit' : '/company/projects/new'}"
              method="post" id="projectForm">

          <div class="row g-3">

            <!-- Title -->
            <div class="col-12">
              <label class="nexus-label">Título do projeto *</label>
              <input type="text" class="nexus-input" name="title" id="projTitle" required
                     th:value="${project != null ? project.title : ''}"
                     placeholder="Ex: Plataforma de Pagamentos PIX">
            </div>

            <!-- Description -->
            <div class="col-12">
              <label class="nexus-label">Descrição *</label>
              <textarea class="nexus-input nexus-textarea" name="description"
                        id="projDesc" required style="min-height:100px"
                        placeholder="Descreva o projeto, objetivos, entregas esperadas..."
                        th:text="${project != null ? project.description : ''}"></textarea>
            </div>

            <!-- Budget -->
            <div class="col-sm-6">
              <label class="nexus-label">Orçamento mínimo (R$) *</label>
              <input type="number" class="nexus-input tabular" name="minimumBudget"
                     id="projMinBudget" min="0" step="100" required
                     th:value="${project != null ? project.minimumBudget : ''}">
            </div>
            <div class="col-sm-6">
              <label class="nexus-label">Orçamento máximo (R$) *</label>
              <input type="number" class="nexus-input tabular" name="maximumBudget"
                     id="projMaxBudget" min="0" step="100" required
                     th:value="${project != null ? project.maximumBudget : ''}">
            </div>

            <!-- Deadline -->
            <div class="col-sm-6">
              <label class="nexus-label">Prazo *</label>
              <input type="date" class="nexus-input tabular" name="deadline"
                     id="projDeadline" required
                     th:value="${project != null and project.deadline != null ? project.deadline : ''}">
            </div>

            <!-- Max positions -->
            <div class="col-sm-6">
              <label class="nexus-label">Vagas disponíveis</label>
              <input type="number" class="nexus-input tabular" name="maxPositions"
                     min="1" value="1"
                     th:value="${project != null and project.maxPositions != null ? project.maxPositions : 1}">
              <div style="color:#475569;font-size:0.75rem;margin-top:4px">
                Puramente informativo — não bloqueia novos matches
              </div>
            </div>

            <!-- Work mode -->
            <div class="col-sm-6">
              <label class="nexus-label">Modalidade *</label>
              <select class="nexus-select" name="workMode" required>
                <option value="">Selecione...</option>
                <option value="REMOTE"  th:selected="${project != null and project.modality == 'REMOTE'}">Remoto</option>
                <option value="ONSITE"  th:selected="${project != null and project.modality == 'ONSITE'}">Presencial</option>
                <option value="HYBRID"  th:selected="${project != null and project.modality == 'HYBRID'}">Híbrido</option>
              </select>
            </div>

            <!-- Type -->
            <div class="col-sm-6">
              <label class="nexus-label">Tipo de oportunidade *</label>
              <select class="nexus-select" name="type" required>
                <option value="">Selecione...</option>
                <option value="FREELANCE"  th:selected="${project != null and project.type == 'FREELANCE'}">Freelance</option>
                <option value="FULL_TIME"  th:selected="${project != null and project.type == 'FULL_TIME'}">Tempo integral</option>
                <option value="PART_TIME"  th:selected="${project != null and project.type == 'PART_TIME'}">Meio período</option>
              </select>
            </div>

            <!-- Experience level -->
            <div class="col-sm-6">
              <label class="nexus-label">Nível de experiência desejado</label>
              <select class="nexus-select" name="experienceLevel">
                <option value="">Não especificar</option>
                <option value="INTERNSHIP" th:selected="${project != null and project.experienceLevel == 'INTERNSHIP'}">Estágio</option>
                <option value="TRAINEE"    th:selected="${project != null and project.experienceLevel == 'TRAINEE'}">Trainee</option>
                <option value="JUNIOR"     th:selected="${project != null and project.experienceLevel == 'JUNIOR'}">Júnior</option>
                <option value="PLENO"      th:selected="${project != null and project.experienceLevel == 'PLENO'}">Pleno</option>
                <option value="SENIOR"     th:selected="${project != null and project.experienceLevel == 'SENIOR'}">Sênior</option>
              </select>
              <div style="color:#475569;font-size:0.75rem;margin-top:4px">
                Se não informado, o componente de experiência não entra no cálculo do score
              </div>
            </div>

            <!-- Skills -->
            <div class="col-12">
              <label class="nexus-label">Skills exigidas *</label>
              <div class="d-flex flex-wrap gap-2 mb-2"
                   th:if="${allSkills != null and !#lists.isEmpty(allSkills)}">
                <label th:each="sk : ${allSkills}" style="cursor:pointer;margin:0">
                  <input type="checkbox" name="skillIds" th:value="${sk.id}"
                         style="display:none" class="skill-cb"
                         th:checked="${project != null and project.requiredSkills != null and project.requiredSkills.contains(sk.name)}">
                  <span class="nexus-chip skill-chip-toggle"
                        th:classappend="${project != null and project.requiredSkills != null and project.requiredSkills.contains(sk.name)} ? ' skill-chip-active' : ''"
                        th:text="${sk.name}">Skill</span>
                </label>
              </div>
              <div th:unless="${allSkills != null and !#lists.isEmpty(allSkills)}"
                   style="color:#475569;font-size:0.875rem">
                Catálogo de skills não disponível.
              </div>
              <div id="skillError" style="color:#ef4444;font-size:0.78rem;display:none;margin-top:4px">
                Selecione ao menos uma skill
              </div>
            </div>

          </div><!-- /row -->

          <!-- Footer -->
          <div class="d-flex gap-2 justify-content-end mt-4">
            <a th:href="@{/company/projects}" class="nexus-btn nexus-btn-ghost">Cancelar</a>
            <button type="submit" class="nexus-btn nexus-btn-primary" id="projSubmitBtn">
              <i th:class="${editMode ? 'ti ti-device-floppy' : 'ti ti-plus'}"></i>
              <span th:text="${editMode ? 'Salvar alterações' : 'Criar projeto'}">Salvar</span>
            </button>
          </div>

        </form>
      </div><!-- /.nexus-card -->

    </div>
  </div>
</div>

<div th:replace="~{fragments/app-shell :: scripts}"></div>
<script>
// Skill chip toggle
document.querySelectorAll('.skill-chip-toggle').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var cb = this.previousElementSibling;
    cb.checked = !cb.checked;
    this.classList.toggle('skill-chip-active', cb.checked);
  });
});

// Validation
document.addEventListener('DOMContentLoaded', function() {
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('projDeadline').min = today;

  var form = document.getElementById('projectForm');
  attachSubmitGuard(form, function() {
    var title    = (document.getElementById('projTitle').value || '').trim();
    var desc     = (document.getElementById('projDesc').value || '').trim();
    var minB     = parseFloat(document.getElementById('projMinBudget').value) || 0;
    var maxB     = parseFloat(document.getElementById('projMaxBudget').value) || 0;
    var deadline = document.getElementById('projDeadline').value;
    var anySkill = Array.from(document.querySelectorAll('.skill-cb:checked')).length > 0;
    document.getElementById('skillError').style.display = anySkill ? 'none' : 'block';
    return title.length >= 2 && desc.length >= 5 && minB <= maxB && deadline >= today && anySkill;
  });
});
</script>
<style>
.skill-chip-active {
  border-color: rgba(107,110,255,0.5) !important;
  background: rgba(107,110,255,0.18) !important;
  color: #a5b4fc !important;
}
</style>
</body>
</html>
