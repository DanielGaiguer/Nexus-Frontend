<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/app-shell :: head('Avaliar Match')}"></head>
<body class="nexus-app">

<div th:replace="~{fragments/app-shell :: shell}"></div>

<div class="page-wrapper">
  <div th:replace="~{fragments/app-shell :: topbar}"></div>

  <div class="page-body">
    <div class="container-xl py-4" style="max-width:680px">

      <div th:if="${errorMsg}" class="nexus-alert nexus-alert-danger mb-4">
        <i class="ti ti-alert-circle"></i><span th:text="${errorMsg}"></span>
      </div>

      <a th:href="${session.userRole == 'PROFESSIONAL'} ? '/pro/matches' : '/company/matches'"
         class="text-decoration-none d-inline-flex align-items-center gap-1 mb-4"
         style="color:#64748b;font-size:0.875rem">
        <i class="ti ti-arrow-left"></i> Voltar para matches
      </a>

      <div class="mb-4">
        <h1 class="fw-bold mb-1" style="font-size:1.75rem;letter-spacing:-0.02em;color:#fff">Avaliar Match</h1>
        <p style="color:#64748b;font-size:0.875rem"
           th:text="'Avaliando: ' + ${match.project.title}">Projeto</p>
      </div>

      <div class="nexus-card p-4">
        <form th:action="${session.userRole == 'PROFESSIONAL'} ?
                          '/pro/matches/' + ${match.id} + '/review' :
                          '/company/matches/' + ${match.id} + '/review'"
              method="post" id="reviewForm">

          <input type="hidden" name="authorType"
                 th:value="${session.userRole == 'PROFESSIONAL'} ? 'PROFESSIONAL' : 'COMPANY'">

          <div class="mb-4">
            <label class="nexus-label mb-2">Avaliação geral *</label>
            <div class="d-flex gap-2 align-items-center">
              <div class="star-group d-flex gap-1">
                <th:block th:each="i : ${#numbers.sequence(1,5)}">
                  <label th:for="'star' + ${i}" style="cursor:pointer">
                    <input type="radio" name="rating" th:id="'star' + ${i}"
                           th:value="${i}" style="display:none" class="star-radio">
                    <i class="ti ti-star star-icon"
                       style="font-size:2rem;color:#334155;transition:color 0.15s"
                       th:data-val="${i}"></i>
                  </label>
                </th:block>
              </div>
              <span id="ratingLabel" style="color:#64748b;font-size:0.85rem">Selecione uma nota</span>
            </div>
          </div>

          <div class="mb-4">
            <label class="nexus-label mb-2">Pontos positivos</label>
            <div class="d-flex flex-wrap gap-2">
              <label th:each="r : ${T(com.main.nexus_frontend.model.PositiveReason).values()}"
                     style="cursor:pointer">
                <input type="checkbox" name="positiveReasons" th:value="${r.name()}" style="display:none" class="pos-cb">
                <span class="nexus-chip reason-chip" th:text="${r.label}">Motivo</span>
              </label>
            </div>
          </div>

          <div class="mb-4">
            <label class="nexus-label mb-2">Pontos negativos</label>
            <div class="d-flex flex-wrap gap-2">
              <label th:each="r : ${T(com.main.nexus_frontend.model.NegativeReason).values()}"
                     style="cursor:pointer">
                <input type="checkbox" name="negativeReasons" th:value="${r.name()}" style="display:none" class="neg-cb">
                <span class="nexus-chip reason-chip-neg" th:text="${r.label}">Motivo</span>
              </label>
            </div>
          </div>

          <div class="mb-4">
            <label class="nexus-label">Comentário <span style="color:#475569">(opcional)</span></label>
            <textarea class="nexus-input nexus-textarea" name="comment"
                      placeholder="Compartilhe mais detalhes sobre sua experiência..."></textarea>
          </div>

          <div class="d-flex gap-2 justify-content-end">
            <a th:href="${session.userRole == 'PROFESSIONAL'} ? '/pro/matches' : '/company/matches'"
               class="nexus-btn nexus-btn-ghost">Cancelar</a>
            <button type="submit" class="nexus-btn nexus-btn-primary" id="reviewSubmitBtn" disabled>
              <i class="ti ti-star"></i> Enviar avaliação
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

<div th:replace="~{fragments/app-shell :: scripts}"></div>
<script>
var ratingLabels = ['','Ruim','Abaixo do esperado','Regular','Bom','Excelente'];

document.querySelectorAll('.star-radio').forEach(function(radio) {
  radio.addEventListener('change', function() {
    var val = parseInt(this.value);
    document.getElementById('ratingLabel').textContent = ratingLabels[val] || '';
    document.querySelectorAll('.star-icon').forEach(function(icon) {
      var v = parseInt(icon.dataset.val);
      if (v <= val) {
        icon.classList.replace('ti-star','ti-star-filled');
        icon.style.color = '#f59e0b';
      } else {
        icon.classList.replace('ti-star-filled','ti-star');
        icon.style.color = '#334155';
      }
    });
    checkSubmit();
  });
});

document.querySelectorAll('.pos-cb').forEach(function(cb) {
  cb.addEventListener('change', function() {
    this.nextElementSibling.style.background  = this.checked ? 'rgba(34,197,94,0.15)' : '';
    this.nextElementSibling.style.borderColor = this.checked ? 'rgba(34,197,94,0.4)' : '';
    this.nextElementSibling.style.color       = this.checked ? '#22c55e' : '';
  });
});

document.querySelectorAll('.neg-cb').forEach(function(cb) {
  cb.addEventListener('change', function() {
    this.nextElementSibling.style.background  = this.checked ? 'rgba(239,68,68,0.12)' : '';
    this.nextElementSibling.style.borderColor = this.checked ? 'rgba(239,68,68,0.35)' : '';
    this.nextElementSibling.style.color       = this.checked ? '#ef4444' : '';
  });
});

function checkSubmit() {
  var rated = document.querySelector('.star-radio:checked');
  document.getElementById('reviewSubmitBtn').disabled = !rated;
}

document.querySelectorAll('.star-icon').forEach(function(icon) {
  icon.addEventListener('click', function() {
    var val = this.dataset.val;
    document.getElementById('star' + val).checked = true;
    document.getElementById('star' + val).dispatchEvent(new Event('change'));
  });
});
</script>
</body>
</html>
