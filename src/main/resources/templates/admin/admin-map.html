<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/app-shell :: head-map('Mapa')}"></head>
<body class="nexus-app">

<div th:replace="~{fragments/app-shell :: shell}"></div>

<div class="page-wrapper">
  <div th:replace="~{fragments/app-shell :: topbar}"></div>

  <div class="page-body" style="padding:0">

    <!-- Layout: sidebar filtros + mapa lado a lado -->
    <div class="d-flex" style="height:calc(100vh - 56px)">

      <!-- ── Sidebar de filtros ── -->
        <div style="width:300px;flex-shrink:0;background:rgba(4,6,19,0.95);
                    border-right:1px solid rgba(255,255,255,0.06);
                    overflow-y:auto;display:flex;flex-direction:column;padding:1.25rem">

          <!-- Título (muda por papel) -->
          <div class="mb-3">
            <div class="fw-semibold text-white" style="font-size:1rem">
              <!-- pro-map:     Mapa de Talentos -->
              <!-- company-map: Mapa de Profissionais -->
              <!-- admin-map:   Mapa Geral -->
              Mapa de Talentos
            </div>
            <div style="color:#64748b;font-size:0.8rem;margin-top:2px">
              Explore profissionais, empresas e oportunidades
            </div>
          </div>

          <!-- Busca por cidade -->
          <form method="get" class="mb-3"
                th:action="${session.userRole == 'PROFESSIONAL'} ? '/pro/map' :
                           (${session.userRole == 'COMPANY'} ? '/company/map' : '/admin/map')">
            <div style="position:relative">
              <i class="ti ti-search"
                 style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);
                        color:#475569;font-size:0.9rem"></i>
              <input type="text" name="city" class="nexus-input"
                     th:value="${cityFilter}"
                     placeholder="Buscar por cidade..."
                     style="padding-left:2.2rem;font-size:0.85rem">
            </div>
            <select name="uf" class="nexus-select mt-2" style="font-size:0.85rem; display: none;">
              <option value="">Todos os estados</option>
              <option th:each="uf : ${ {'AC','AL','AM','AP','BA','CE','DF','ES','GO','MA',
                                        'MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN',
                                        'RO','RR','RS','SC','SE','SP','TO'} }"
                      th:value="${uf}" th:text="${uf}"
                      th:selected="${uf == ufFilter}">UF</option>
            </select>
            <button type="submit" class="nexus-btn nexus-btn-primary w-100 mt-2"
                    style="font-size:0.82rem">
              <i class="ti ti-filter"></i> Filtrar por cidade
            </button>
          </form>

          <!-- Tipo -->
          <div class="mb-3">
            <div class="nexus-section-title">Tipo</div>
            <div class="d-flex flex-column gap-1">

              <!-- Ambos -->
              <label class="type-filter-option d-flex align-items-center gap-2"
                     data-type="all"
                     onclick="setTypeFilter('all', this)"
                     style="cursor:pointer;padding:0.45rem 0.6rem;border-radius:8px;
                            transition:background 0.2s">
                <span style="width:10px;height:10px;border-radius:50%;
                             background:linear-gradient(135deg,#6b6eff,#67e8f9);
                             flex-shrink:0"></span>
                <span style="color:#e2e8f0;font-size:0.875rem;font-weight:500">Todos</span>
                <span id="count-all" class="nexus-badge-count ms-auto">0</span>
              </label>

              <!-- Profissionais -->
              <label class="type-filter-option d-flex align-items-center gap-2"
                     data-type="professionals"
                     onclick="setTypeFilter('professionals', this)"
                     style="cursor:pointer;padding:0.45rem 0.6rem;border-radius:8px;
                            transition:background 0.2s">
                <span style="width:10px;height:10px;border-radius:50%;
                             background:#6b6eff;flex-shrink:0"></span>
                <span style="color:#94a3b8;font-size:0.875rem">Profissionais</span>
                <span id="count-pros" class="nexus-badge-count ms-auto">0</span>
              </label>

              <!-- Empresas -->
              <label class="type-filter-option d-flex align-items-center gap-2"
                     data-type="companies"
                     onclick="setTypeFilter('companies', this)"
                     style="cursor:pointer;padding:0.45rem 0.6rem;border-radius:8px;
                            transition:background 0.2s">
                <span style="width:10px;height:10px;border-radius:50%;
                             background:#f59e0b;flex-shrink:0"></span>
                <span style="color:#94a3b8;font-size:0.875rem">Empresas</span>
                <span id="count-cos" class="nexus-badge-count ms-auto">0</span>
              </label>

              <!-- Oportunidades -->
              <label class="type-filter-option d-flex align-items-center gap-2"
                     data-type="opportunities"
                     onclick="setTypeFilter('opportunities', this)"
                     style="cursor:pointer;padding:0.45rem 0.6rem;border-radius:8px;
                            transition:background 0.2s">
                <span style="width:10px;height:10px;border-radius:50%;
                             background:linear-gradient(135deg,#a78bfa,#22c55e);
                             flex-shrink:0"></span>
                <span style="color:#94a3b8;font-size:0.875rem">Oportunidades</span>
                <span id="count-opps" class="nexus-badge-count ms-auto">0</span>
              </label>

              <!-- Sub-select de tipo de oportunidade (só aparece ao selecionar Oportunidades) -->
              <div id="oppTypeSubSelect"
                   style="display:none;margin-left:1.25rem;margin-top:0.3rem;
                          padding:0.6rem;background:rgba(107,110,255,0.06);
                          border-radius:8px;border:1px solid rgba(107,110,255,0.12)">
                <div style="color:#6b6eff;font-size:0.7rem;font-weight:700;
                            text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.4rem">
                  Tipo de oportunidade
                </div>
                <div class="d-flex flex-column gap-1">

                  <label onclick="setOppTypeFilter('')"
                         class="opp-type-opt d-flex align-items-center gap-2"
                         style="cursor:pointer;padding:0.3rem 0.4rem;border-radius:6px;
                                transition:background 0.15s;background:rgba(107,110,255,0.1)">
                    <i class="ti ti-circle-filled" style="font-size:0.5rem;color:#a78bfa"></i>
                    <span style="color:#e2e8f0;font-size:0.82rem;font-weight:500">Todos</span>
                  </label>

                  <label onclick="setOppTypeFilter('PROJECT'); highlightOppType(this)"
                         class="opp-type-opt d-flex align-items-center gap-2"
                         style="cursor:pointer;padding:0.3rem 0.4rem;border-radius:6px;
                                transition:background 0.15s">
                    <i class="ti ti-briefcase" style="font-size:0.8rem;color:#a78bfa"></i>
                    <span style="color:#94a3b8;font-size:0.82rem">Projetos</span>
                  </label>

                  <label onclick="setOppTypeFilter('JOB'); highlightOppType(this)"
                         class="opp-type-opt d-flex align-items-center gap-2"
                         style="cursor:pointer;padding:0.3rem 0.4rem;border-radius:6px;
                                transition:background 0.15s">
                    <i class="ti ti-file-text" style="font-size:0.8rem;color:#22c55e"></i>
                    <span style="color:#94a3b8;font-size:0.82rem">Vagas de emprego</span>
                  </label>

                </div>
              </div>

            </div>
          </div>

          <!-- Distância -->
          <div class="mb-3">
            <div class="nexus-section-title">Distância (km)</div>
            <div class="row g-2">
              <div class="col-6">
                <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 radius-btn"
                        data-radius="5" onclick="setRadius(5, this)">5 km</button>
              </div>
              <div class="col-6">
                <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 radius-btn"
                        data-radius="10" onclick="setRadius(10, this)">10 km</button>
              </div>
              <div class="col-6">
                <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 radius-btn"
                        data-radius="20" onclick="setRadius(20, this)">20 km</button>
              </div>
              <div class="col-6">
                <button class="nexus-btn nexus-btn-primary nexus-btn-sm w-100 radius-btn active-radius"
                        data-radius="50" onclick="setRadius(50, this)">50 km</button>
              </div>
            </div>
            <div style="color:#475569;font-size:0.72rem;margin-top:6px;text-align:center"
                 id="radius-label">Mostrando raio de 50 km</div>
          </div>

          <!-- Legenda -->
          <div class="mt-auto pt-3" style="border-top:1px solid rgba(255,255,255,0.06)">
            <div class="nexus-section-title mb-2">Legenda</div>
            <div class="d-flex flex-column gap-2">
              <div class="d-flex align-items-center gap-2">
                <span style="width:12px;height:12px;border-radius:50%;
                             background:#6b6eff;flex-shrink:0"></span>
                <span style="color:#94a3b8;font-size:0.82rem">Profissional</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span style="width:12px;height:12px;border-radius:50%;
                             background:#f59e0b;flex-shrink:0"></span>
                <span style="color:#94a3b8;font-size:0.82rem">Empresa</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span style="width:12px;height:12px;border-radius:50%;
                             background:#a78bfa;flex-shrink:0"></span>
                <span style="color:#94a3b8;font-size:0.82rem">Projeto</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span style="width:12px;height:12px;border-radius:50%;
                             background:#22c55e;flex-shrink:0"></span>
                <span style="color:#94a3b8;font-size:0.82rem">Vaga de emprego</span>
              </div>
            </div>
            <div style="color:#475569;font-size:0.75rem;margin-top:0.75rem">
              <span id="visible-count">0</span> resultado(s) visível(is)
            </div>
          </div>

        </div>

      <!-- ── Mapa ── -->
      <div style="flex:1;position:relative">
        <div id="map" style="width:100%;height:100%"></div>
        <!-- Badge de filtro ativo -->
        <div style="position:absolute;bottom:1rem;right:1rem;
                    background:rgba(9,14,31,0.9);
                    border:1px solid rgba(107,110,255,0.2);
                    border-radius:8px;padding:0.4rem 0.75rem;
                    font-size:0.78rem;color:#a5b4fc;
                    pointer-events:none"
             id="filter-badge">Filtro: 50 km</div>
      </div>

    </div><!-- /d-flex -->
  </div><!-- /page-body -->
</div><!-- /page-wrapper -->

<div th:replace="~{fragments/app-shell :: scripts-map}"></div>

<script th:inline="javascript">
/*<![CDATA[*/

var PROFESSIONALS = /*[[${professionalsJson}]]*/ [];
var COMPANIES = /*[[${companiesJson}]]*/ [];
var OPPORTUNITIES  = /*[[${opportunitiesJson}]]*/ [];
var CENTER_LAT = /*[[${centerLat}]]*/ -23.3045;
var CENTER_LNG = /*[[${centerLng}]]*/ -51.1696;

function highlightOppType(el) {
  document.querySelectorAll('.opp-type-opt').forEach(function(o) {
    o.style.background = '';
  });
  if (el) el.style.background = 'rgba(107,110,255,0.1)';
}

// ── Init Leaflet ─────────────────────────────────────────────
var map = L.map('map', { zoomControl: true }).setView([CENTER_LAT, CENTER_LNG], 10);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ── Custom icons ─────────────────────────────────────────────
function makeIcon(color, letter) {
  return L.divIcon({
    className: '',
    iconSize: [34, 34],
    iconAnchor: [17, 34],
    popupAnchor: [0, -36],
    html: '<div style="width:34px;height:34px;border-radius:50%;background:' + color + ';' +
          'border:2px solid rgba(255,255,255,0.18);display:flex;align-items:center;' +
          'justify-content:center;font-size:0.8rem;font-weight:700;color:#fff;' +
          'box-shadow:0 0 12px ' + color + '55;">' + letter + '</div>'
  });
}

var iconPro = makeIcon('#6b6eff', 'P');
var iconCo  = makeIcon('#f59e0b', 'E');

// ── Layers ───────────────────────────────────────────────────
var layerPros = L.layerGroup();
var layerCos  = L.layerGroup();
var currentRadius = 50;
var currentType   = 'all';

function distanceKm(lat1, lng1, lat2, lng2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
          Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function renderMarkers() {
  layerPros.clearLayers();
  layerCos.clearLayers();

  var countPros = 0, countCos = 0;

  if (currentType !== 'companies') {
    PROFESSIONALS.forEach(function(p) {
      if (!p.latitude || !p.longitude) return;
      var dist = distanceKm(CENTER_LAT, CENTER_LNG, p.latitude, p.longitude);
      if (dist > currentRadius) return;
      countPros++;
      var skills = (p.skills || []).slice(0,3).join(', ');
      var popup = '<div style="min-width:180px;font-family:Inter,sans-serif">' +
        '<div style="font-weight:700;color:#fff;margin-bottom:3px">' + p.name + '</div>' +
        '<div style="color:#64748b;font-size:0.78rem;margin-bottom:6px">' +
          (p.city || '') + (p.uf ? ', '+p.uf : '') +
        '</div>' +
        '<span style="font-size:0.7rem;background:rgba(107,110,255,0.15);color:#a5b4fc;' +
          'padding:2px 7px;border-radius:20px">Profissional</span>' +
        (skills ? '<div style="margin-top:6px;font-size:0.75rem;color:#94a3b8">' + skills + '</div>' : '') +
        (p.available === false ? '<div style="margin-top:4px;color:#f59e0b;font-size:0.72rem">⚠ Indisponível</div>' : '') +
        '</div>';
      L.marker([p.latitude, p.longitude], { icon: iconPro })
        .bindPopup(popup, { className: 'nexus-popup' })
        .addTo(layerPros);
    });
  }

  if (currentType !== 'professionals') {
    COMPANIES.forEach(function(c) {
      if (!c.latitude || !c.longitude) return;
      var dist = distanceKm(CENTER_LAT, CENTER_LNG, c.latitude, c.longitude);
      if (dist > currentRadius) return;
      countCos++;
      var popup = '<div style="min-width:180px;font-family:Inter,sans-serif">' +
        '<div style="font-weight:700;color:#fff;margin-bottom:3px">' + c.companyName + '</div>' +
        '<div style="color:#64748b;font-size:0.78rem;margin-bottom:6px">' +
          (c.city || '') + (c.uf ? ', '+c.uf : '') +
        '</div>' +
        '<span style="font-size:0.7rem;background:rgba(245,158,11,0.15);color:#f59e0b;' +
          'padding:2px 7px;border-radius:20px">Empresa</span>' +
        (c.description ? '<div style="margin-top:6px;font-size:0.75rem;color:#94a3b8;' +
          'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">' +
          c.description + '</div>' : '') +
        '</div>';
      L.marker([c.latitude, c.longitude], { icon: iconCo })
        .bindPopup(popup, { className: 'nexus-popup' })
        .addTo(layerCos);
    });
  }

  layerPros.addTo(map);
  layerCos.addTo(map);

  var total = countPros + countCos;
  document.getElementById('count-all').textContent  = total;
  document.getElementById('count-pros').textContent = countPros;
  document.getElementById('count-cos').textContent  = countCos;
  document.getElementById('visible-count').textContent = total;
  document.getElementById('filter-badge').textContent  = 'Filtro: ' + currentRadius + ' km';
  document.getElementById('radius-label').textContent  = 'Mostrando raio de ' + currentRadius + ' km';
}

function setRadius(r, btn) {
  currentRadius = r;
  document.querySelectorAll('.radius-btn').forEach(function(b) {
    b.classList.remove('nexus-btn-primary', 'active-radius');
    b.classList.add('nexus-btn-ghost');
  });
  btn.classList.add('nexus-btn-primary', 'active-radius');
  btn.classList.remove('nexus-btn-ghost');
  renderMarkers();
}

function setTypeFilter(type, el) {
  currentType = type;
  document.querySelectorAll('[onclick^="setTypeFilter"]').forEach(function(l) {
    l.style.background = '';
  });
  el.style.background = 'rgba(107,110,255,0.1)';
  renderMarkers();
}

// Inicializa com "Ambos" ativo
document.querySelector('[onclick="setTypeFilter(\'all\', this)"]').style.background = 'rgba(107,110,255,0.1)';

renderMarkers();

// Popup style override
var style = document.createElement('style');
style.textContent = '.nexus-popup .leaflet-popup-content-wrapper{background:rgba(9,14,31,0.97);' +
  'border:1px solid rgba(107,110,255,0.2);border-radius:10px;color:#e2e8f0;box-shadow:0 8px 32px rgba(0,0,0,0.5)}' +
  '.nexus-popup .leaflet-popup-tip{background:rgba(9,14,31,0.97)}' +
  '.nexus-popup .leaflet-popup-close-button{color:#64748b}';
document.head.appendChild(style);

/*]]>*/
</script>

</body>
</html>
