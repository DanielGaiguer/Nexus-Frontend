<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/app-shell :: head('Skills')}"></head>
<body class="nexus-app">

<div th:replace="~{fragments/app-shell :: shell}"></div>

<div class="page-wrapper">
  <div th:replace="~{fragments/app-shell :: topbar}"></div>

  <div class="page-body">
    <div class="container-xl py-4">

      <!-- Flash -->
      <div th:if="${successMsg}" class="nexus-alert nexus-alert-success mb-4">
        <i class="ti ti-circle-check"></i><span th:text="${successMsg}"></span>
      </div>
      <div th:if="${errorMsg}" class="nexus-alert nexus-alert-danger mb-4">
        <i class="ti ti-alert-circle"></i><span th:text="${errorMsg}"></span>
      </div>

      <!-- Header -->
      <div class="d-flex align-items-start justify-content-between mb-4 gap-3 flex-wrap">
        <div>
          <h1 class="fw-bold mb-1" style="font-size:1.75rem;letter-spacing:-0.02em;color:#fff">Gerenciamento de Skills</h1>
          <p style="color:#64748b;font-size:0.875rem"
             th:text="${#lists.size(skills)} + ' skills cadastradas'">0 skills</p>
        </div>
        <button type="button" class="nexus-btn nexus-btn-primary"
                data-bs-toggle="modal" data-bs-target="#addSkillModal">
          <i class="ti ti-plus"></i> Nova skill
        </button>
      </div>

      <!-- Category filter pills -->
      <div class="d-flex flex-wrap gap-2 mb-4">
        <button class="nexus-btn nexus-btn-primary nexus-btn-sm" id="cat-all"
                onclick="filterCategory('all')">Todas</button>
        <button class="nexus-btn nexus-btn-ghost nexus-btn-sm" id="cat-Backend"
                onclick="filterCategory('Backend')">Backend</button>
        <button class="nexus-btn nexus-btn-ghost nexus-btn-sm" id="cat-Frontend"
                onclick="filterCategory('Frontend')">Frontend</button>
        <button class="nexus-btn nexus-btn-ghost nexus-btn-sm" id="cat-Mobile"
                onclick="filterCategory('Mobile')">Mobile</button>
        <button class="nexus-btn nexus-btn-ghost nexus-btn-sm" id="cat-DevOps"
                onclick="filterCategory('DevOps')">DevOps</button>
        <button class="nexus-btn nexus-btn-ghost nexus-btn-sm" id="cat-Database"
                onclick="filterCategory('Database')">Database</button>
        <button class="nexus-btn nexus-btn-ghost nexus-btn-sm" id="cat-Data"
                onclick="filterCategory('Data')">Data</button>
        <button class="nexus-btn nexus-btn-ghost nexus-btn-sm" id="cat-API"
                onclick="filterCategory('API')">API</button>
      </div>

      <!-- Grouped by category -->
      <div class="d-flex flex-column gap-3" id="skillGroups">
        <th:block th:each="catEntry : ${skillsByCategory}">
          <div class="nexus-card p-4 skill-group" th:data-category="${catEntry.key}">
            <div class="d-flex align-items-center gap-2 mb-3">
              <i class="ti ti-tag" th:style="${catEntry.key == 'Backend'   ? 'color:#6b6eff' :
                                               catEntry.key == 'Frontend'  ? 'color:#67e8f9' :
                                               catEntry.key == 'Mobile'    ? 'color:#f472b6' :
                                               catEntry.key == 'DevOps'    ? 'color:#22c55e' :
                                               catEntry.key == 'Database'  ? 'color:#f59e0b' :
                                               catEntry.key == 'Data'      ? 'color:#a78bfa' :
                                                                             'color:#94a3b8'}"></i>
              <span class="fw-semibold text-white" th:text="${catEntry.key}">Categoria</span>
              <span class="nexus-status-badge purple" th:text="${#lists.size(catEntry.value)}">0</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <div th:each="sk : ${catEntry.value}"
                   class="d-flex align-items-center gap-1">
                <span class="nexus-chip" th:text="${sk.name}">Skill</span>
                <button type="button"
                        class="delete-skill-trigger"
                        style="background:none;border:none;color:#475569;cursor:pointer;padding:2px 4px;border-radius:4px;transition:color 0.2s;font-size:0.85rem"
                        th:data-id="${sk.id}" th:data-name="${sk.name}"
                        onmouseenter="this.style.color='#ef4444'"
                        onmouseleave="this.style.color='#475569'">
                  <i class="ti ti-x"></i>
                </button>
              </div>
            </div>
          </div>
        </th:block>
      </div>

      <!-- Empty -->
      <div th:if="${skills == null or #lists.isEmpty(skills)}"
           class="nexus-card p-5 text-center">
        <i class="ti ti-tag-off" style="font-size:3rem;color:#334155;display:block;margin-bottom:1rem"></i>
        <div class="fw-semibold text-white mb-1">Nenhuma skill cadastrada</div>
        <button type="button" class="nexus-btn nexus-btn-primary mt-2"
                data-bs-toggle="modal" data-bs-target="#addSkillModal">
          <i class="ti ti-plus"></i> Adicionar primeira skill
        </button>
      </div>

    </div>
  </div>
</div>

<!-- ══ MODAL NOVA SKILL ══════════════════════════════════════ -->
<div class="modal fade nexus-modal" id="addSkillModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-semibold text-white">Nova Skill</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form th:action="@{/admin/skills}" method="post" id="addSkillForm">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="nexus-label">Nome da skill *</label>
              <input type="text" class="nexus-input" name="name" id="skillName"
                     required placeholder="Ex: Spring Boot">
              <div id="skillDupError"
                   style="color:#ef4444;font-size:0.78rem;margin-top:4px;display:none">
                Já existe uma skill com esse nome.
              </div>
            </div>
            <div class="col-12">
              <label class="nexus-label">Categoria</label>
              <select class="nexus-select" name="category" id="skillCategory" required>
                <option value="">Selecione...</option>
                <option value="Backend">Backend</option>
                <option value="Frontend">Frontend</option>
                <option value="Mobile">Mobile</option>
                <option value="DevOps">DevOps</option>
                <option value="Database">Database</option>
                <option value="Data">Data</option>
                <option value="API">API</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="nexus-btn nexus-btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="nexus-btn nexus-btn-primary" id="addSkillBtn">
            <i class="ti ti-plus"></i> Adicionar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ══ MODAL DELETAR SKILL ══════════════════════════════════ -->
<div class="modal fade nexus-modal" id="deleteSkillModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="border-bottom-color:rgba(239,68,68,0.15)">
        <div style="width:4px;height:40px;background:#ef4444;border-radius:2px;margin-right:0.75rem"></div>
        <h5 class="modal-title fw-semibold text-white">Remover skill</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p style="color:#94a3b8;font-size:0.875rem">
          Deseja remover a skill
          <strong class="text-white" id="deleteSkillName">—</strong>?
          Profissionais e projetos que a utilizam perderão essa associação.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="nexus-btn nexus-btn-ghost" data-bs-dismiss="modal">Cancelar</button>
        <form id="deleteSkillForm" method="post">
          <button type="submit" class="nexus-btn nexus-btn-danger-outline">
            <i class="ti ti-trash"></i> Remover
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/app-shell :: scripts}"></div>
<script>
// Collect existing skill names for duplicate check
var existingSkills = [];
document.querySelectorAll('.nexus-chip').forEach(function(chip) {
  existingSkills.push(chip.textContent.trim().toLowerCase());
});

// Category filter
function filterCategory(cat) {
  document.querySelectorAll('[id^="cat-"]').forEach(function(b) {
    b.classList.remove('nexus-btn-primary');
    b.classList.add('nexus-btn-ghost');
  });
  document.getElementById('cat-' + cat).classList.add('nexus-btn-primary');
  document.getElementById('cat-' + cat).classList.remove('nexus-btn-ghost');
  document.querySelectorAll('.skill-group').forEach(function(g) {
    g.style.display = (cat === 'all' || g.dataset.category === cat) ? 'block' : 'none';
  });
}

// Validation: name required, no duplicate, category required
document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('addSkillForm');
  attachSubmitGuard(form, function() {
    var name = (document.getElementById('skillName').value || '').trim();
    var cat  = document.getElementById('skillCategory').value;
    var isDup = existingSkills.includes(name.toLowerCase());
    document.getElementById('skillDupError').style.display = (name && isDup) ? 'block' : 'none';
    return name.length >= 1 && !isDup && cat.length > 0;
  });

  document.getElementById('skillName').addEventListener('input', function() {
    var name  = this.value.trim().toLowerCase();
    var isDup = existingSkills.includes(name);
    document.getElementById('skillDupError').style.display = (name && isDup) ? 'block' : 'none';
  });
});

// Delete trigger
document.querySelectorAll('.delete-skill-trigger').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.getElementById('deleteSkillName').textContent = this.dataset.name;
    document.getElementById('deleteSkillForm').action = '/admin/skills/' + this.dataset.id + '/delete';
    new bootstrap.Modal(document.getElementById('deleteSkillModal')).show();
  });
});
</script>
</body>
</html>
