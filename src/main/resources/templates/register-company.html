<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cadastro Empresa')}"></head>
<body class="auth-page">

    <div th:replace="~{fragments/header :: header}"></div>

    <main style="min-height:calc(100vh - 72px);display:flex;align-items:center;padding:2rem 0;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card border-0 p-4" style="background:linear-gradient(145deg, rgba(9,14,31,0.95), rgba(13,19,41,0.95));">
                        <div class="card-body p-3">
                            <div class="text-center mb-4">
                                <div class="auth-logo mx-auto mb-3">
                                    <i class="ti ti-building-skyscraper"></i>
                                </div>
                                <span class="badge d-inline-flex align-items-center gap-1 mb-2"
                                      style="background:linear-gradient(135deg,rgba(6,182,212,0.12),rgba(107,110,255,0.12));color:#67e8f9;padding:0.45rem 1rem;border-radius:50px;border:1px solid rgba(6,182,212,0.2);">
                                    <i class="ti ti-building"></i>Sou Empresa
                                </span>
                                <h3 class="fw-bold mb-1 text-light">Cadastre sua empresa</h3>
                                <p style="color:var(--text-secondary);" class="small mb-0">
                                    Encontre os melhores profissionais para seus projetos de TI.
                                </p>
                            </div>

                            <div class="alert alert-approval d-flex align-items-center gap-2 py-3 mb-4">
                                <i class="ti ti-info-circle"></i>
                                <div>
                                    <strong>Prazo de aprova&ccedil;&atilde;o</strong><br>
                                    <small>Ap&oacute;s o cadastro, sua conta passar&aacute; por an&aacute;lise administrativa.</small>
                                </div>
                            </div>

                            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                                <i class="ti ti-alert-circle"></i>
                                <span th:text="${error}">Erro</span>
                            </div>

                            <form th:action="@{/auth/register/company}" method="post">
                                <h6 class="fw-semibold mb-3" style="color:#67e8f9;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.04em;">
                                    <i class="ti ti-building me-2"></i>Dados da empresa
                                </h6>
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label">Nome da empresa</label>
                                        <input type="text" class="form-control" name="companyName" required placeholder="Minha Empresa Ltda">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">CNPJ</label>
                                        <input type="text" class="form-control" name="taxId" placeholder="00.000.000/0001-00">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" name="email" required placeholder="contato@empresa.com">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Senha</label>
                                        <input type="password" class="form-control" name="password" required placeholder="M&iacute;nimo 6 caracteres">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Telefone</label>
                                        <input type="text" class="form-control" name="phone" placeholder="(11) 99999-9999">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">CEP</label>
                                        <input type="text" class="form-control" name="cep" placeholder="00000-000" maxlength="9">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Descri&ccedil;&atilde;o da empresa</label>
                                        <textarea class="form-control" name="description" rows="3"
                                                  placeholder="Fale sobre sua empresa e os projetos que costuma contratar..."></textarea>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-glow w-100 py-2 mt-2">
                                    <i class="ti ti-building-plus me-2"></i>Solicitar cadastro
                                </button>
                            </form>

                            <div class="mt-4 text-center">
                                <p class="small mb-0" style="color:var(--text-secondary);">
                                    J&aacute; tem conta? <a th:href="@{/auth/login}" style="color:var(--primary-light);">Fa&ccedil;a login</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
