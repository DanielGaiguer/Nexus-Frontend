<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/app-shell :: head('Estatísticas')}"></head>
<body class="nexus-app">

<div th:replace="~{fragments/app-shell :: shell}"></div>

<div class="page-wrapper">
  <div th:replace="~{fragments/app-shell :: topbar}"></div>

  <div class="page-body">
    <div class="container-xl py-4">

      <!-- Header -->
      <div class="mb-4">
        <a th:if="${professionalId != null}"
           th:href="@{/admin/professional/{id}(id=${professionalId})}"
           class="text-decoration-none d-inline-flex align-items-center gap-1 mb-2"
           style="color:#64748b;font-size:0.82rem">
          <i class="ti ti-arrow-left"></i> Voltar para o perfil
        </a>
        <h1 class="fw-bold mb-1" style="font-size:1.75rem;letter-spacing:-0.02em;color:#fff">Estatísticas</h1>
        <p style="color:#64748b;font-size:0.875rem"
           th:text="${professionalId != null} ? 'Desempenho do profissional na plataforma' : 'Acompanhe seu desempenho na plataforma'">
          Acompanhe seu desempenho na plataforma</p>
      </div>

      <!-- 4 stat cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="nexus-card p-3 text-center">
            <div style="color:#64748b;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem">Matches recebidos</div>
            <div class="fw-bold" style="font-size:2rem;color:#fff" th:text="${stats.totalMatchesReceived}">0</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="nexus-card p-3 text-center">
            <div style="color:#64748b;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem">Confirmados</div>
            <div class="fw-bold" style="font-size:2rem;color:#22c55e" th:text="${stats.totalAccepted}">0</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="nexus-card p-3 text-center">
            <div style="color:#64748b;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem">Rejeitados por mim</div>
            <div class="fw-bold" style="font-size:2rem;color:#ef4444" th:text="${stats.totalRejectedByMe}">0</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="nexus-card p-3 text-center">
            <div style="color:#64748b;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem">Taxa de aceitação</div>
            <div class="fw-bold" style="font-size:2rem;color:#a5b4fc" th:text="${#numbers.formatDecimal(stats.acceptanceRate,1,'COMMA',0,'POINT')} + '%'">0%</div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <!-- Score médio — score-ring -->
        <div class="col-md-6">
          <div class="nexus-card p-4 d-flex align-items-center gap-4">
            <div th:with="s=${stats.getAvgScoreAsInt()},
                          c=${s>=85?'high':(s>=70?'medium':'low')}">
              <div class="nexus-score-ring" style="position:relative;width:100px;height:100px;flex-shrink:0">
                <svg width="100" height="100" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
                  <circle cx="50" cy="50" r="42" class="nexus-score-ring-bg" stroke-width="7"/>
                  <circle cx="50" cy="50" r="42"
                          th:class="'nexus-score-ring-fill ' + ${c}"
                          stroke-width="7"
                          stroke-dasharray="263.89"
                          th:stroke-dashoffset="${263.89 - (s/100.0)*263.89}"/>
                </svg>
                <div class="nexus-score-ring-label">
                  <span class="nexus-score-ring-pct" style="font-size:1.1rem" th:text="${s} + '%'">0%</span>
                  <span class="nexus-score-ring-tag"
                        th:text="${s>=85?'Alto':(s>=70?'Médio':'Baixo')}"
                        th:style="${s>=85?'color:#22c55e':(s>=70?'color:#f59e0b':'color:#ef4444')}">Alto</span>
                </div>
              </div>
            </div>
            <div>
              <div style="color:#64748b;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.25rem">Score médio</div>
              <div class="fw-bold text-white" style="font-size:1.5rem"
                   th:text="${#numbers.formatDecimal(stats.avgScore,1,'COMMA',1,'POINT')}">0.0</div>
              <div style="color:#64748b;font-size:0.8rem;margin-top:0.25rem">Baseado na compatibilidade dos seus matches</div>
            </div>
          </div>
        </div>

        <!-- Posição no ranking -->
        <div class="col-md-6">
          <div class="nexus-card p-4 d-flex align-items-center gap-4">
            <div style="width:64px;height:64px;border-radius:16px;background:rgba(245,158,11,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ti ti-trophy" style="font-size:1.75rem;color:#f59e0b"></i>
            </div>
            <div>
              <div style="color:#64748b;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.25rem">Posição no ranking</div>
              <div class="fw-bold text-white" style="font-size:1.5rem" th:text="${stats.rankingPosition}">—</div>
              <div style="color:#64748b;font-size:0.8rem;margin-top:0.25rem">Baseado no seu score médio de compatibilidade</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div th:replace="~{fragments/app-shell :: scripts}"></div>
</body>
</html>
