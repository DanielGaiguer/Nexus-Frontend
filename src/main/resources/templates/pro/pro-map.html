<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/app-shell :: head-map('Mapa')}"></head>
<body class="nexus-app">

<div th:replace="~{fragments/app-shell :: shell}"></div>

<div class="page-wrapper">
  <div th:replace="~{fragments/app-shell :: topbar}"></div>

  <div class="page-body" style="padding:0">
    <div class="d-flex" style="height:calc(100vh - 56px)">

      <!-- Sidebar filtros -->
      <div style="width:280px;flex-shrink:0;border-right:1px solid rgba(255,255,255,0.06);overflow-y:auto;padding:1.25rem">
        <div class="fw-semibold text-white mb-3" style="font-size:0.95rem">Filtros do mapa</div>

        <!-- Busca por cidade -->
        <form method="get" th:action="@{/pro/map}" class="mb-3">
          <label class="nexus-label">Buscar cidade</label>
          <div class="d-flex gap-1">
            <input type="text" class="nexus-input" name="city" placeholder="Ex: São Paulo"
                   style="font-size:0.82rem;flex:1">
            <button type="submit" class="nexus-btn nexus-btn-primary nexus-btn-sm">
              <i class="ti ti-search"></i>
            </button>
          </div>
        </form>

        <!-- Tipo -->
        <div class="mb-3">
          <label class="nexus-label">Exibir</label>
          <div class="d-flex flex-column gap-1">
            <button class="nexus-btn nexus-btn-primary nexus-btn-sm w-100 text-start map-type-btn" data-type="all" onclick="filterMapType('all')">Ambos</button>
            <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 text-start map-type-btn" data-type="professionals" onclick="filterMapType('professionals')">Profissionais</button>
            <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 text-start map-type-btn" data-type="companies" onclick="filterMapType('companies')">Empresas</button>
          </div>
        </div>

        <!-- Distância -->
        <div class="mb-3">
          <label class="nexus-label">Distância máxima</label>
          <div class="d-flex flex-column gap-1">
            <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 text-start dist-btn" data-km="5" onclick="filterDistance(5)">Até 5 km</button>
            <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 text-start dist-btn" data-km="10" onclick="filterDistance(10)">Até 10 km</button>
            <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 text-start dist-btn" data-km="20" onclick="filterDistance(20)">Até 20 km</button>
            <button class="nexus-btn nexus-btn-primary nexus-btn-sm w-100 text-start dist-btn" data-km="50" onclick="filterDistance(50)">Até 50 km</button>
            <button class="nexus-btn nexus-btn-ghost nexus-btn-sm w-100 text-start dist-btn" data-km="0" onclick="filterDistance(0)">Sem limite</button>
          </div>
        </div>

        <!-- Legenda -->
        <div class="mt-3">
          <label class="nexus-label">Legenda</label>
          <div class="d-flex flex-column gap-2" style="font-size:0.8rem;color:#94a3b8">
            <div class="d-flex align-items-center gap-2">
              <div style="width:12px;height:12px;border-radius:50%;background:#6b6eff"></div> Profissional
            </div>
            <div class="d-flex align-items-center gap-2">
              <div style="width:12px;height:12px;border-radius:50%;background:#f59e0b"></div> Empresa
            </div>
          </div>
        </div>
      </div>

      <!-- Mapa -->
      <div id="map" style="flex:1;height:100%"></div>
    </div>
  </div>
</div>

<!-- Data injection -->
<script th:inline="javascript">
var PROFESSIONALS = /*[[${professionalsJson}]]*/ [];
var COMPANIES = /*[[${companiesJson}]]*/ [];
var USER_LAT = /*[[${userLat}]]*/ -23.55;
var USER_LNG = /*[[${userLng}]]*/ -46.63;
</script>

<div th:replace="~{fragments/app-shell :: scripts-map}"></div>
<script th:src="@{/js/nexus-map.js}"></script>
</body>
</html>
