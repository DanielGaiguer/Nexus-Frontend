<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="nexus-app" data-bs-theme="dark">
<th:block th:replace="~{fragments/app-shell :: app-head('Dashboard')}"></th:block>
<body>
<th:block th:replace="~{fragments/app-shell :: app-layout('dashboard', ~{this :: content})}">
<th:block th:fragment="content">

    <div class="mb-4">
        <p class="text-muted mb-1" style="font-size:0.9rem;">Olá,</p>
        <h2 class="fw-bold mb-0" style="font-size:1.75rem;letter-spacing:-0.02em;"
            th:text="${userName}">Profissional</h2>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <th:block th:replace="~{fragments/components :: stat-card('Convites pendentes', ${invitesCount}, 'mail', 'accent')}"></th:block>
        </div>
        <div class="col-md-4">
            <th:block th:replace="~{fragments/components :: stat-card('Matches confirmados', ${confirmedCount}, 'check', 'success')}"></th:block>
        </div>
        <div class="col-md-4">
            <th:block th:replace="~{fragments/components :: stat-card('Score médio', ${avgScore}, 'star', 'primary')}"></th:block>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header d-flex align-items-center justify-content-between">
            <h3 class="card-title fw-semibold mb-0">Últimos convites recebidos</h3>
            <a th:href="@{/pro/matches}" class="text-decoration-none" style="color:var(--nexus-primary);font-size:0.85rem;font-weight:500;">
                Ver todos <i class="ti ti-arrow-right"></i>
            </a>
        </div>
        <div class="card-body p-0">
            <th:block th:if="${#lists.isEmpty(recentInvites)}">
                <th:block th:replace="~{fragments/components :: empty-state('mail-open', 'Nenhum convite pendente', 'Quando empresas demonstrarem interesse, os convites aparecerão aqui.', 'Ver oportunidades', '/pro/opportunities')}"></th:block>
            </th:block>
            <th:block th:unless="${#lists.isEmpty(recentInvites)}">
                <div class="list-group list-group-flush">
                    <div class="list-group-item d-flex align-items-center gap-3 py-3"
                         th:each="invite : ${recentInvites}"
                         style="background:transparent;border-color:rgba(255,255,255,0.06);">
                        <th:block th:replace="~{fragments/components :: avatar(${invite.project.company.companyName}, 'md')}"></th:block>
                        <div class="flex-fill overflow-hidden">
                            <div class="fw-semibold text-white text-truncate"
                                 th:text="${invite.project.company.companyName}">Empresa</div>
                            <div class="text-muted small text-truncate"
                                 th:text="${invite.project.title}">Projeto</div>
                        </div>
                        <th:block th:replace="~{fragments/components :: score-badge(${invite.scoreAsInt}, 'sm')}"></th:block>
                        <a th:href="@{/pro/matches}" class="btn btn-sm btn-outline-light flex-shrink-0">Ver</a>
                    </div>
                </div>
            </th:block>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
            <h3 class="card-title fw-semibold mb-0">Matches confirmados recentes</h3>
            <a th:href="@{/pro/matches}" class="text-decoration-none" style="color:var(--nexus-primary);font-size:0.85rem;font-weight:500;">
                Ver todos <i class="ti ti-arrow-right"></i>
            </a>
        </div>
        <div class="card-body p-0">
            <th:block th:if="${#lists.isEmpty(recentConfirmed)}">
                <th:block th:replace="~{fragments/components :: empty-state('heart-handshake', 'Nenhum match ainda', 'Quando houver compatibilidade mútua, os matches confirmados aparecerão aqui.', 'Ver oportunidades', '/pro/opportunities')}"></th:block>
            </th:block>
            <th:block th:unless="${#lists.isEmpty(recentConfirmed)}">
                <div class="list-group list-group-flush">
                    <div class="list-group-item d-flex align-items-center gap-3 py-3"
                         th:each="match : ${recentConfirmed}"
                         style="background:transparent;border-color:rgba(255,255,255,0.06);">
                        <th:block th:replace="~{fragments/components :: avatar(${match.project.company.companyName}, 'md')}"></th:block>
                        <div class="flex-fill overflow-hidden">
                            <div class="fw-semibold text-white text-truncate"
                                 th:text="${match.project.company.companyName}">Empresa</div>
                            <div class="text-muted small text-truncate"
                                 th:text="${match.project.title}">Projeto</div>
                        </div>
                        <th:block th:replace="~{fragments/components :: score-badge(${match.scoreAsInt}, 'sm')}"></th:block>
                        <th:block th:replace="~{fragments/components :: status-badge('MATCHED')}"></th:block>
                        <a th:href="@{/pro/matches}" class="btn btn-sm btn-outline-light flex-shrink-0">Ver</a>
                    </div>
                </div>
            </th:block>
        </div>
    </div>

</th:block>
</th:block>
</body>
</html>
