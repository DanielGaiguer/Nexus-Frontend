<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cadastro enviado')}"></head>
<body class="auth-page">

    <div th:replace="~{fragments/header :: header}"></div>

    <main style="min-height:calc(100vh - 72px);display:flex;align-items:center;padding:2rem 0;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="card border-0 p-4 text-center" style="background:linear-gradient(145deg, rgba(9,14,31,0.95), rgba(13,19,41,0.95));">
                        <div class="card-body p-3">
                            <div class="mb-4">
                                <div style="width:80px;height:80px;border-radius:50%;margin:0 auto 1.5rem;background:linear-gradient(135deg,rgba(107,110,255,0.15),rgba(167,139,250,0.15));border:2px solid rgba(107,110,255,0.2);display:flex;align-items:center;justify-content:center;">
                                    <i class="ti ti-circle-check" style="font-size:2.5rem;color:var(--success);"></i>
                                </div>
                                <h3 class="fw-bold mb-2 text-light">Cadastro enviado!</h3>
                                <p style="color:var(--text-secondary);" class="mb-0">
                                    Sua solicita&ccedil;&atilde;o foi recebida com sucesso.
                                </p>
                            </div>

                            <div class="alert alert-approval d-flex align-items-center gap-2 py-3 text-start">
                                <i class="ti ti-clock-hour-4"></i>
                                <div>
                                    <strong>Aprova&ccedil;&atilde;o pendente</strong><br>
                                    <small>Um administrador analisar&aacute; seu cadastro em breve.</small>
                                </div>
                            </div>

                            <a th:href="@{/}" class="btn btn-primary btn-glow w-100 py-2 mt-3">
                                <i class="ti ti-home me-2"></i>Voltar para Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
