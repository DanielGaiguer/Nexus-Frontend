<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Entrar')}"></head>
<body class="auth-page">

    <div th:replace="~{fragments/header :: header}"></div>

    <main style="min-height:calc(100vh - 72px);display:flex;align-items:center;padding:2rem 0;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="card border-0 p-4" style="background:linear-gradient(145deg, rgba(9,14,31,0.95), rgba(13,19,41,0.95));">
                        <div class="card-body p-3">
                            <div class="text-center mb-4">
                                <div class="auth-logo mx-auto mb-3">
                                    <img th:src="@{/img/nexus-icon.png}" alt="Nexus" style="width:60px;height:60px;border-radius:16px;object-fit:contain;" />
                                </div>
                                <h3 class="fw-bold mb-1 text-light">Bem-vindo de volta</h3>
                                <p style="color:var(--text-secondary);" class="small mb-0">Entre com suas credenciais para continuar</p>
                            </div>

                            <div th:if="${error}"
                                 class="auth-error-block"
                                 style="background:rgba(239,68,68,0.08);
                                        border:1px solid rgba(239,68,68,0.25);
                                        border-left:3px solid #ef4444;
                                        border-radius:10px;
                                        padding:0.85rem 1rem;
                                        margin-bottom:1.25rem;
                                        display:flex;
                                        align-items:flex-start;
                                        gap:0.65rem">
                              <i class="ti ti-alert-circle"
                                 style="color:#ef4444;font-size:1.1rem;flex-shrink:0;margin-top:1px"></i>
                              <div>
                                <div style="color:#fca5a5;font-size:0.875rem;font-weight:600;line-height:1.3"
                                     th:text="${error}">Erro</div>
                              </div>
                            </div>

                            <div th:if="${linkedinError}"
                                 class="auth-error-block"
                                 style="background:rgba(239,68,68,0.08);
                                        border:1px solid rgba(239,68,68,0.25);
                                        border-left:3px solid #ef4444;
                                        border-radius:10px;
                                        padding:0.85rem 1rem;
                                        margin-bottom:1.25rem;
                                        display:flex;
                                        align-items:flex-start;
                                        gap:0.65rem">
                              <i class="ti ti-alert-circle"
                                 style="color:#ef4444;font-size:1.1rem;flex-shrink:0;margin-top:1px"></i>
                              <div style="color:#fca5a5;font-size:0.875rem;font-weight:600;line-height:1.3"
                                   th:with="msg=${
                                       linkedinError == 'no_account' ? 'Nenhuma conta encontrada com o e-mail do seu LinkedIn. Cadastre-se primeiro.' :
                                       (linkedinError == 'denied' ? 'Login com LinkedIn cancelado.' :
                                       (linkedinError == 'pending_approval' ? 'Cadastro de empresa aguardando aprovação do administrador.' :
                                       (linkedinError == 'rejected' ? 'Cadastro de empresa foi rejeitado.' :
                                       (linkedinError == 'inactive' ? 'Esta conta está inativa.' :
                                       (linkedinError == 'session_expired' ? 'Sua sessão expirou. Faça login novamente.' :
                                       (linkedinError == 'no_email' ? 'Seu LinkedIn não retornou um e-mail verificado. Tente com outra conta ou cadastre-se manualmente.' :
                                       'Não foi possível entrar com o LinkedIn. Tente novamente.'))))))}"
                                   th:text="${msg}">Erro</div>
                            </div>

                            <div th:if="${githubError}"
                                 class="auth-error-block"
                                 style="background:rgba(239,68,68,0.08);
                                        border:1px solid rgba(239,68,68,0.25);
                                        border-left:3px solid #ef4444;
                                        border-radius:10px;
                                        padding:0.85rem 1rem;
                                        margin-bottom:1.25rem;
                                        display:flex;
                                        align-items:flex-start;
                                        gap:0.65rem">
                              <i class="ti ti-alert-circle"
                                 style="color:#ef4444;font-size:1.1rem;flex-shrink:0;margin-top:1px"></i>
                              <div style="color:#fca5a5;font-size:0.875rem;font-weight:600;line-height:1.3"
                                   th:with="msg=${
                                       githubError == 'no_account' ? 'Nenhuma conta encontrada com o e-mail do seu GitHub. Cadastre-se primeiro.' :
                                       (githubError == 'not_professional' ? 'Login com GitHub disponível apenas para profissionais.' :
                                       (githubError == 'denied' ? 'Login com GitHub cancelado.' :
                                       (githubError == 'inactive' ? 'Esta conta está inativa.' :
                                       (githubError == 'session_expired' ? 'Sua sessão expirou. Faça login novamente.' :
                                       (githubError == 'email_in_use' ? 'Este e-mail já está cadastrado no Nexus. Faça login e conecte o GitHub pelo seu perfil.' :
                                       (githubError == 'no_email' ? 'Seu GitHub não tem um e-mail público. Torne um e-mail público em github.com/settings/emails e tente novamente.' :
                                       'Não foi possível entrar com o GitHub. Tente novamente.'))))))}"
                                   th:text="${msg}">Erro</div>
                            </div>

                            <div th:if="${success}"
                                 style="background:rgba(34,197,94,0.08);
                                        border:1px solid rgba(34,197,94,0.25);
                                        border-left:3px solid #22c55e;
                                        border-radius:10px;
                                        padding:0.85rem 1rem;
                                        margin-bottom:1.25rem;
                                        display:flex;
                                        align-items:flex-start;
                                        gap:0.65rem">
                              <i class="ti ti-circle-check"
                                 style="color:#22c55e;font-size:1.1rem;flex-shrink:0;margin-top:1px"></i>
                              <div style="color:#86efac;font-size:0.875rem;font-weight:600"
                                   th:text="${success}">Sucesso</div>
                            </div>

                            <form th:action="@{/auth/login}" method="post">
                                <input type="hidden" name="redirect" th:if="${redirect}" th:value="${redirect}">
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="ti ti-mail"></i></span>
                                        <input type="email" class="form-control" name="email" required placeholder="seu@email.com">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Senha</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="ti ti-lock"></i></span>
                                        <input type="password" class="form-control" name="password" required placeholder="Sua senha">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-glow w-100 py-2 mt-2">
                                    <i class="ti ti-login me-2"></i>Entrar
                                </button>
                            </form>

                            <div class="d-flex align-items-center gap-2 my-3">
                                <hr class="flex-fill m-0" style="border-color:var(--border-color);">
                                <small style="color:var(--text-muted);">ou</small>
                                <hr class="flex-fill m-0" style="border-color:var(--border-color);">
                            </div>

                            <a th:href="${redirect} != null ? @{/auth/linkedin/login(redirect=${redirect})} : @{/auth/linkedin/login}"
                               class="btn w-100 py-2 d-flex align-items-center justify-content-center gap-2"
                               style="background:#0A66C2;border:none;color:#fff;">
                                <i class="ti ti-brand-linkedin" style="font-size:1.1rem"></i>Entrar com LinkedIn
                            </a>

                            <a th:href="${redirect} != null ? @{/auth/github/login(redirect=${redirect})} : @{/auth/github/login}"
                               class="btn w-100 py-2 d-flex align-items-center justify-content-center gap-2 mt-2"
                               style="background:#24292f;border:none;color:#fff;">
                                <i class="ti ti-brand-github" style="font-size:1.1rem"></i>Entrar com GitHub
                            </a>

                            <div class="mt-4 text-center">
                                <p class="small mb-2" style="color:var(--text-secondary);">Ainda n&atilde;o tem conta?</p>
                                <div class="d-flex gap-2 justify-content-center">
                                    <a th:href="@{/auth/register/professional}" class="btn btn-outline-light btn-sm">
                                        <i class="ti ti-user-plus me-1"></i>Sou Profissional
                                    </a>
                                    <a th:href="@{/auth/register/company}" class="btn btn-outline-light btn-sm">
                                        <i class="ti ti-building me-1"></i>Sou Empresa
                                    </a>
                                </div>
                            </div>

                            <hr class="my-4" style="border-color:var(--border-color) !important;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.querySelector('form[action="/auth/login"]');
            if (!form) return;
            attachSubmitGuard(form, function() {
                var email = form.querySelector('[name="email"]').value.trim();
                var pass  = form.querySelector('[name="password"]').value;
                return validateEmail(email) && pass.length >= 6;
            });
        });
    </script>
</body>
</html>
