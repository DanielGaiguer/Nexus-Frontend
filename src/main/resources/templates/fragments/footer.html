<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="nexus-footer border-top py-5 mt-5" style="border-color:var(--border-color) !important;">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#6b6eff,#a78bfa);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:0.9rem;">N</div>
                    <span class="fw-bold fs-4 text-light">Nexus</span>
                </div>
                <p class="text-muted small mb-0" style="max-width:320px;">
                    Conectando empresas de TI aos melhores profissionais aut&ocirc;nomos atrav&eacute;s de matchmaking inteligente.
                </p>
            </div>
            <div class="col-lg-2 offset-lg-2">
                <h6 class="fw-semibold mb-3 text-light small text-uppercase" style="letter-spacing:0.05em;">Plataforma</h6>
                <ul class="list-unstyled">
                    <li class="mb-2"><a th:href="@{/#how-it-works}">Como funciona</a></li>
                    <li class="mb-2"><a th:href="@{/#matching-engine}">Matchmaking</a></li>
                    <li class="mb-2"><a th:href="@{/auth/login}">Entrar</a></li>
                </ul>
            </div>
            <div class="col-lg-2">
                <h6 class="fw-semibold mb-3 text-light small text-uppercase" style="letter-spacing:0.05em;">Cadastro</h6>
                <ul class="list-unstyled">
                    <li class="mb-2"><a th:href="@{/auth/register/professional}">Sou Profissional</a></li>
                    <li class="mb-2"><a th:href="@{/auth/register/company}">Sou Empresa</a></li>
                </ul>
            </div>
            <div class="col-lg-2">
                <h6 class="fw-semibold mb-3 text-light small text-uppercase" style="letter-spacing:0.05em;">Legal</h6>
                <ul class="list-unstyled">
                    <li class="mb-2"><a href="#">Privacidade</a></li>
                    <li class="mb-2"><a href="#">Termos</a></li>
                </ul>
            </div>
        </div>
        <hr class="my-4" style="border-color:var(--border-color) !important;">
        <div class="text-center text-muted small">
            <p class="mb-0">&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> Nexus Platform. Todos os direitos reservados.</p>
        </div>
    </div>
</footer>
</body>
</html>
