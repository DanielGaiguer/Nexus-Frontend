spring.application.name=nexus-frontend
server.port=8082
# 127.0.0.1 em vez de localhost: chamada servidor a servidor via RestClient Java puro.
# No Windows, a resolucao de localhost pelo Java as vezes tenta IPv6 (::1) antes do
# IPv4, causando lentidao/flakiness na conexao. Forcar o IP evita essa resolucao.
# (nexus.ws.base-url abaixo sao consumido pelo browser, que nao sofre desse problema,
# por isso ficou com localhost mesmo.)
nexus.api.base-url=http://127.0.0.1:8081/api
nexus.ws.base-url=http://localhost:8081
spring.thymeleaf.cache=false

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
